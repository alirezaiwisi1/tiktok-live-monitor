<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تست TikTok Live Monitor</title>
<style>
  body { font-family: Tahoma, sans-serif; background: #111; color: #eee; padding: 20px; }
  .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin: 12px 0; }
  .badge { background: #fe2c55; color: #fff; padding: 2px 10px; border-radius: 6px; font-size: 13px; }
  iframe { width: 100%; height: 600px; border: 0; border-radius: 8px; }
  button { padding: 8px 16px; background: #fe2c55; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<h1>🔴 TikTok Live Monitor</h1>
<button onclick="load()">بررسی مجدد</button>
<div id="lives">در حال بررسی…</div>
<script>
async function load() {
  const el = document.getElementById("lives");
  try {
    const d = await (await fetch("/api/lives")).json();
    el.innerHTML = d.live.length
      ? d.live.map(u => `
          <div class="card">
            <h3>@${u.username} <span class="badge">LIVE</span></h3>
            <iframe src="https://www.tiktok.com/embed/live/${u.username}" allow="fullscreen"></iframe>
          </div>`).join("")
      : "<p>هیچ‌کس لایو نیست.</p>";
  } catch (e) {
    el.textContent = "خطا: " + e.message;
  }
}
load();
</script>
</body>
</html>
